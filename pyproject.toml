[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "special-export-mcp"
version = "0.1.0"
description = "MCP server that fetches Wikipedia wikitext via Special:Export and parses wikitables into structured data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "types-requests",
    "types-defusedxml",
    "pip-audit>=2.7",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/Mirza404/special-export-mcp"

[project.scripts]
special-export-mcp = "special_export_mcp.server:main"

[tool.setuptools.packages.find]
include = ["special_export_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["special_export_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: makes real network calls, excluded by default",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["special_export_mcp/wikitext"]

[tool.coverage.report]
fail_under = 85
